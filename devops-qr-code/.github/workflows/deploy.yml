name: CI/CD Pipeline
on: 
  push: 
    branches: [" main "]

jobs: 
  deploy: 
    runs-on: ubuntu-latest

    steps: 
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with: 
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build frontend
      run: |
        docker build -t 