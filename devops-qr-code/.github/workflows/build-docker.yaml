name: Build and Publish image to Docker Hub
on: 

jobs: 
  publish_images: 
    runs-on: ubuntu-latest
    steps: 
      - name: checkout 
        uses: actions/checkout@v4
      - name: build image 
        run: docker build ./api/ -t akshat321123/api:latest 
      - name: push image to docker hub
        run: |
        docker push akshat321123/api:latest