version: "3.9"

services:
  frontend:
    build:
      context: ./front-end-nextjs
      dockerfile: Dockerfile
    image: qr-frontend:latest
    container_name: qr-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: qr-api:latest
    container_name: qr-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
