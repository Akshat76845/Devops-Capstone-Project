name: Build and Push Docker Images
on: 
  push: 
    branches: [ "master" ]

jobs: 
  build: 
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN}}

      - name: Build FastAPI Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/api:latest ./api
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api:latest

      # Build & push Next.js
      - name: Build Next.js Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend-nextjs:latest ./front-end-nextjs
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/nextjs-frontend:latest